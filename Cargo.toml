[workspace]
resolver = "2"
members = [
  "crates/aiops-core",
  "crates/aiops-k8s",
  "crates/aiops-cli",
  "crates/aiops-diagnostics",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = [ "Dylan Bibb" ]
license = "MIT"
repository = "https://github.com/wdylanbibb/aiops"
publish = false

[workspace.dependencies]
aiops-core = { path = "crates/aiops-core" }
aiops-k8s = { path = "crates/aiops-k8s" }
aiops-diagnostics = { path = "crates/aiops-diagnostics" }

anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.0.0", features = ["runtime", "derive", "client"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

