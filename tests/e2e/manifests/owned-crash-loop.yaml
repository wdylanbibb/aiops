apiVersion: apps/v1
kind: Deployment
metadata:
  name: owned-crash-loop
  namespace: aiops-e2e
  labels:
    app.kubernetes.io/name: owned-crash-loop
    app.kubernetes.io/part-of: aiops-e2e
    aiops.dev/scenario: owned-crash-loop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: owned-crash-loop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owned-crash-loop
        app.kubernetes.io/part-of: aiops-e2e
        aiops.dev/scenario: owned-crash-loop
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "panic: simulated controller-owned startup failure"
              exit 1
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
