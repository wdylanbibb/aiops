apiVersion: v1
kind: Pod
metadata:
  name: readiness-failure
  namespace: aiops-e2e
  labels:
    app.kubernetes.io/name: readiness-failure
    app.kubernetes.io/part-of: aiops-e2e
    aiops.dev/scenario: readiness-failure
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
        - |
          echo "application is running but deliberately not ready"
          exec sleep 3600
      readinessProbe:
        exec:
          command: ["sh", "-c", "echo simulated readiness failure >&2; exit 1"]
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 1
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
