apiVersion: v1
kind: Pod
metadata:
  name: log-patterns
  namespace: aiops-e2e
  labels:
    app.kubernetes.io/name: log-patterns
    app.kubernetes.io/part-of: aiops-e2e
    aiops.dev/scenario: log-patterns
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
        - |
          echo "out of memory while allocating request buffer"
          echo "panic: simulated worker failure"
          echo "connection refused while contacting database:5432"
          echo "x509: certificate has expired or is not yet valid"
          echo "ordinary informational line that must not produce a finding"
          exec sleep 3600
      readinessProbe:
        exec:
          command: ["sh", "-c", "exit 0"]
        initialDelaySeconds: 1
        periodSeconds: 2
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
